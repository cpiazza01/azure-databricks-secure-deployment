name: Manual Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      module:
        required: true 
        description: "Terraform Module Name"
        type: choice
        options:
          - cdp-workspace-level-components
          - cdp-account-level-components
          - azurerm-cdp-dbx-workspace
      command:
        required: true 
        description: "Terraform Command"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./module/${{ inputs.module }}
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name  == 'test' && 'test' || 'dev' }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://accounts.azuredatabricks.net
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ADMIN_CLIENT_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true  # 👈 This tells Terraform to use OIDC natively
      ARM_USE_CLI: false   # 👈 Prevents Terraform from trying to use the CLI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
        
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      
      - name: Terraform Init
        id: init
        run: terraform init -backend-config=env-config/${{ vars.ENV }}-backend.conf

      - name: Terraform ${{ inputs.command }}
        run: terraform ${{ inputs.command }} -auto-approve -var-file="env-config/${{ vars.ENV }}.tfvars"